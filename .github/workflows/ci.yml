name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Анализ кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Статический анализ
        run: flutter analyze --fatal-infos

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build-web:
    name: Сборка веб-версии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Сохранить веб-версию
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-web
          path: build/web
          retention-days: 30

  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Сборка APK без подписи
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Релиз APK
    needs: [analyze, test, build-apk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # Ключ подписи берётся из Secrets. Без них сборка не падает:
      # получится обычный APK без подписи, годный для проверки, но
      # не для публикации в магазинах.
      - name: Восстановить ключ подписи
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          key.store=upload-keystore.jks
          key.alias=${{ secrets.KEY_ALIAS }}
          key.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.key.password=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Сборка подписанного APK
        run: flutter build apk --release

      - name: Проверить подпись
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          body: |
            ## TaskFlow ${{ github.run_number }}

            Готовый APK для Android. Он открытый: установить можно
            откуда угодно, данные остаются на вашем сервере.

            **Требования:** Android 7.0 и новее, разрешения камера и
            микрофон выдаёт приложение при первом запуске.

            **Как начать:** укажите адрес своего сервера, введите логин
            и пароль, выданные администратором.
