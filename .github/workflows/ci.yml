name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Анализ кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Статический анализ
        run: flutter analyze --fatal-infos

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build-web:
    name: Сборка веб-версии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Сохранить веб-версию
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-web
          path: build/web
          retention-days: 30

  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Сборка APK без подписи
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30


  release:
    name: Релиз APK
    needs: [analyze, test, build-apk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # Ключ подписи берётся из Secrets. Без них сборка не падает:
      # получится обычный APK без подписи, годный для проверки, но
      # не для публикации в магазинах.
      #
      # Проверка ключа сделана внутри скрипта, а не через `if:`: условие
      # вида `if: ${{ secrets.X != '' }}` GitHub отвергает целиком, и
      # сборка падает ещё до первого шага.
      - name: Сборка APK
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
            printf 'key.store=upload-keystore.jks\n' > android/key.properties
            printf 'key.alias=%s\n' "${{ secrets.KEY_ALIAS }}" >> android/key.properties
            printf 'key.store.password=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            printf 'key.key.password=%s\n' "${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            flutter build apk --release
            $ANDROID_HOME/build-tools/*/apksigner verify --verbose \
              build/app/outputs/flutter-apk/app-release.apk
          else
            flutter build apk --release
          fi

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          # Тег указываем явно: без него публикация прерывается с
          # «GitHub Releases requires a tag».
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          body: |
            ## TaskFlow ${{ github.run_number }}

            Готовый APK для Android. Он открытый: установить можно
            откуда угодно, данные остаются на вашем сервере.

            **Требования:** Android 7.0 и новее, разрешения камера и
            микрофон выдаёт приложение при первом запуске.

