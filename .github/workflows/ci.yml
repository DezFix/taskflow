name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Анализ кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Проверка стиля
        run: flutter analyze --fatal-infos

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build-apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Сборка APK без подписи
        run: flutter build apk --release

      - name: Публикация APK
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    name: Сборка веб-клиента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Публикация веб-клиента
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-web
          path: build/web
          retention-days: 30

  release:
    name: Релиз APK
    needs: [analyze, test, build-apk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get

      # Подпись берём из Secrets. Без них сборка идёт отладочным ключом:
      # такой APK годится для проверки, но не для обновления у сотрудников.
      - name: Восстановление ключа подписи
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          key.store=upload-keystore.jks
          key.alias=${{ secrets.KEY_ALIAS }}
          key.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          key.key.password=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Сборка подписанного APK
        run: flutter build apk --release

      - name: Проверка подписи
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          body: |
            ## TaskFlow ${{ github.run_number }}

            Скачайте APK и установите на телефон. При обновлении старая
            версия заменится автоматически, данные и переписка сохранятся
            на сервере офиса.

            **Требуется:** Android 7.0 и выше, разрешение на микрофон
            для голосовых сообщений.

            Первый запуск: укажите адрес сервера офиса, затем войдите
            логином и паролем, которые выдал глава отдела.
